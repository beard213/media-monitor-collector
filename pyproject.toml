[project]
name = "media-monitor"
version = "0.2.0"
description = "Unified foreign social media collection service architecture"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.28",
  "pydantic>=2",
  "pydantic-settings>=2",
  "playwright>=1.45",
  "uvicorn[standard]>=0.27",
  "yt-dlp>=2026.7.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
