[project]
name = "media-monitor"
version = "0.1.0"
description = "Unified multi-platform social media collection and monitoring service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.28",
  "pydantic>=2",
  "pydantic-settings>=2",
  "uvicorn[standard]>=0.27",
  "yt-dlp>=2026.7.4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
